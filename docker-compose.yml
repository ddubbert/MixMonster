version: '3'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
      - MONGO_INITDB_DATABASE=mixmonster
      - MONGO_INITDB_ROOT_USERNAME=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=mongo
    ports:
        - 27017:27017
    command: mongod
    restart: always

  backend:
    container_name: mixmonster-backend 
    build:
        context: ./mixmonster_backend
    depends_on:
      - mongodb  
    volumes:
      - ./mixmonster_backend:/app/backend
      - /app/backend/node_modules
    environment:
      - DB_USER=mongodb
      - DB_PASSWORD=mongo
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=mixmonster
      - DB_AUTHSOURCE=admin
      - APP_PORT=9000
    ports:
      - 9000:9000

  frontend:
    container_name: mixmonster-frontend
    build:
      context: ./mixmonster_frontend
    volumes:
      - ./mixmonster_frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - 8080:8080
    environment:  
      - VUE_APP_BACKEND_URL=http://localhost:9000/graphql
