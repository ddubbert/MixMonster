version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
      - MONGO_INITDB_DATABASE=${DB_DATABASE}
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
        - ${DB_PORT}:${DB_PORT}
    command: mongod
    restart: always
    volumes:
      - mixmonster_mongo:/data/db

  backend:
    container_name: mixmonster-backend
    restart: always
    build:
        context: ./mixmonster_backend
    ports:
      - 4000:4000
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_AUTHSOURCE=${DB_AUTHSOURCE}
      - BACKEND_PORT=4000
    volumes:
      - mixmonster_backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      - mongodb

  frontend:
    container_name: mixmonster-frontend
    restart: always
    build:
      context: ./mixmonster_frontend
      args:
        frontend_host: ${MIXMONSTER_HOST}
        frontend_port: ${MIXMONSTER_PORT}
    ports:
      - ${MIXMONSTER_PORT}:80
    volumes:
      - mixmonster_frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  mixmonster_frontend:
  mixmonster_backend:
  mixmonster_mongo:
